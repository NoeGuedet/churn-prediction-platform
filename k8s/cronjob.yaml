# Model 3 (optional): K-Means segmentation recomputed every hour.
# Only consumes resources while running — but its requests
# temporarily count against the quota (see ADR, section 5).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: segmentation
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: segmentation
              image: noeguedet/orchestration-ml-segmentation:1.0.0
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "400m"
                  memory: "384Mi"
