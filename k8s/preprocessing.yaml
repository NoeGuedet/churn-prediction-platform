apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessing
  labels:
    app: preprocessing
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: preprocessing
  template:
    metadata:
      labels:
        app: preprocessing
    spec:
      containers:
        - name: preprocessing
          image: churn-prediction-platform/preprocessing:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: WORKERS
              # 1 worker is enough: ~5-10 ms of CPU per transform,
              # well below 150 req/min. Each worker loads
              # pandas+sklearn (~150Mi) — 2 workers exceeded the
              # requests (kubectl top measurement: 305Mi).
              value: "1"
          resources:
            requests:
              cpu: "200m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "288Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: preprocessing-svc
spec:
  type: ClusterIP
  selector:
    app: preprocessing
  ports:
    - port: 8001
      targetPort: 8001
