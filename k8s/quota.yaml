# Plafond du namespace : la somme des requests/limits de tous les pods
# ne peut pas dépasser ces valeurs (cas 3 : 2500m / 1.5Gi).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: projet-quota
spec:
  hard:
    requests.cpu: "2500m"
    requests.memory: "1.5Gi"
    limits.cpu: "2500m"
    limits.memory: "1.5Gi"
