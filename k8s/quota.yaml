# Namespace ceiling: the sum of all pods' requests/limits cannot
# exceed these values (2500m CPU / 1.5Gi memory).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: projet-quota
spec:
  hard:
    requests.cpu: "2500m"
    requests.memory: "1.5Gi"
    limits.cpu: "2500m"
    limits.memory: "1.5Gi"
