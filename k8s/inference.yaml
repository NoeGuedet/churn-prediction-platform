apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  labels:
    app: inference
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1   # see ADR section 5: the surge (450m/544Mi) fits within the quota margin
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      containers:
        - name: inference
          image: churn-prediction-platform/inference:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: PREPROCESSING_URL
              value: "http://preprocessing-svc:8001"
            - name: MONITORING_URL
              value: "http://monitoring-svc:8003"
            - name: CHURN_THRESHOLD
              value: "0.5"
            - name: WORKERS
              value: "2"
          resources:
            requests:
              cpu: "450m"
              memory: "448Mi"
            limits:
              cpu: "700m"
              memory: "544Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
# NodePort: the only service exposed outside the cluster (the load
# script reaches it via `minikube service inference-svc -n churn-prediction-platform --url`).
apiVersion: v1
kind: Service
metadata:
  name: inference-svc
spec:
  type: NodePort
  selector:
    app: inference
  ports:
    - port: 8002
      targetPort: 8002
