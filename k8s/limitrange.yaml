# Per-container bounds + default values (required: as soon as a quota
# exists, any pod without declared requests/limits is rejected).
apiVersion: v1
kind: LimitRange
metadata:
  name: projet-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1000m"
        memory: "768Mi"
      min:
        cpu: "50m"
        memory: "64Mi"
