services:
  preprocessing:
    build:
      context: .
      dockerfile: services/preprocessing/Dockerfile
    image: churn-prediction-platform/preprocessing:1.0.0
    ports:
      - "8001:8001"

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    image: churn-prediction-platform/inference:1.0.0
    ports:
      - "8002:8002"
    environment:
      PREPROCESSING_URL: ${PREPROCESSING_URL:-http://preprocessing:8001}
      MONITORING_URL: ${MONITORING_URL:-http://monitoring:8003}
      CHURN_THRESHOLD: ${CHURN_THRESHOLD:-0.5}
      WORKERS: ${WORKERS:-2}
    depends_on:
      - preprocessing
      - monitoring

  monitoring:
    build:
      context: .
      dockerfile: services/monitoring/Dockerfile
    image: churn-prediction-platform/monitoring:1.0.0
    ports:
      - "8003:8003"

  webui:
    build:
      context: .
      dockerfile: services/webui/Dockerfile
    image: churn-prediction-platform/webui:1.0.0
    ports:
      - "7860:7860"
    environment:
      INFERENCE_URL: ${INFERENCE_URL:-http://inference:8002}
    depends_on:
      - inference
