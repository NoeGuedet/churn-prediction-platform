# CI/CD pipeline: blocking tests (coverage >= 80%), then build and
# push Docker Hub images only if the tests pass.
# On pull requests, images are built but not pushed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  VERSION: "1.0.0"

jobs:
  # ------------------------------------------------------------------
  # Stage 1: tests. If this job fails, no build is triggered.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt \
                      -r services/preprocessing/requirements.txt \
                      -r services/inference/requirements.txt \
                      -r services/monitoring/requirements.txt

      # pytest.ini enforces --cov-fail-under=80: the job fails below 80%.
      - name: Tests (coverage >= 80%, blocking)
        run: pytest

  # ------------------------------------------------------------------
  # Stage 2: multi-arch build (amd64 + arm64, to cover both Intel and
  # Apple Silicon machines) and push to Docker Hub.
  # ------------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [preprocessing, inference, monitoring, segmentation]
    steps:
      - uses: actions/checkout@v4

      # QEMU: emulation to build arm64 images from an x86_64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Credentials in the repo's encrypted secrets — never in plaintext.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (${{ matrix.service }}) and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push only on main; on PRs, the build acts as validation.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestration-ml-${{ matrix.service }}:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestration-ml-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
