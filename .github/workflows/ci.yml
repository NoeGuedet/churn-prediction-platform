# Pipeline CI/CD : tests bloquants (couverture >= 80 %), puis build et
# push des images Docker Hub uniquement si les tests passent.
# Sur les pull requests, les images sont construites mais non poussées.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  VERSION: "1.0.0"

jobs:
  # ------------------------------------------------------------------
  # Étape 1 : tests. Si ce job échoue, aucun build n'est déclenché.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements-dev.txt \
                      -r services/preprocessing/requirements.txt \
                      -r services/inference/requirements.txt \
                      -r services/monitoring/requirements.txt

      # pytest.ini impose --cov-fail-under=80 : le job échoue sous 80 %.
      - name: Tests (couverture >= 80 %, bloquant)
        run: pytest

  # ------------------------------------------------------------------
  # Étape 2 : build multi-arch (amd64 + arm64, pour couvrir les machines
  # Intel et Apple Silicon) et push sur Docker Hub.
  # ------------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [preprocessing, inference, monitoring, segmentation]
    steps:
      - uses: actions/checkout@v4

      # QEMU : émulation pour construire les images arm64 depuis un
      # runner x86_64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Identifiants dans les secrets chiffrés du repo — jamais en clair.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (${{ matrix.service }}) et push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push uniquement sur main ; sur PR, le build sert de validation.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestration-ml-${{ matrix.service }}:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestration-ml-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
