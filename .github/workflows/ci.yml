# CI/CD pipeline: blocking tests (coverage >= 80%), then multi-arch
# build validation, then deployment to the self-hosted LXC over SSH
# (through Tailscale) on pushes to main.
# On pull requests, only tests and builds run (validation).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  VERSION: "1.0.0"

jobs:
  # ------------------------------------------------------------------
  # Stage 1: tests. If this job fails, nothing else is triggered.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt \
                      -r services/preprocessing/requirements.txt \
                      -r services/inference/requirements.txt \
                      -r services/monitoring/requirements.txt \
                      -r services/webui/requirements.txt

      # pytest.ini enforces --cov-fail-under=80: the job fails below 80%.
      - name: Tests (coverage >= 80%, blocking)
        run: pytest

  # ------------------------------------------------------------------
  # Stage 2: multi-arch build (amd64 + arm64, to cover both Intel and
  # Apple Silicon machines). Validation only — images are not published
  # to any registry; production builds them locally on the host.
  # ------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [preprocessing, inference, monitoring, segmentation, webui]
    steps:
      - uses: actions/checkout@v4

      # QEMU: emulation to build arm64 images from an x86_64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: churn-prediction-platform/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------------
  # Stage 3: deployment on the self-hosted LXC. The runner joins the
  # tailnet ephemerally (OAuth client, tag:ci), then pulls the code and
  # rebuilds/restarts the stack over SSH. Requires the environment
  # "production" approval if configured in the repo settings.
  # ------------------------------------------------------------------
  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Waits until the LXC is reachable before deploying.
          ping: ${{ secrets.VM_HOST }}

      - name: Deploy over SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VM_USER@$VM_HOST" \
            'cd /opt/churn-prediction-platform && \
             git pull --ff-only && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build && \
             docker image prune -f'
